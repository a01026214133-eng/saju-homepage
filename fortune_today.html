<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘의 운세 - 오복신당</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { min-height: 100vh; background: #FDF6E3; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Serif KR', serif;
      background: transparent;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      overflow-x: hidden;
    }

    .content, .header { position: relative; z-index: 1; }

    .header {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: #fff;
      padding: 0 1.1rem;
      height: 54px;
      display: flex;
      align-items: center;
      z-index: 100;
      box-shadow: 0 1px 0 #e8e2d9;
    }
    .header .back-btn {
      background: none; border: none;
      font-size: 1.3rem; color: #1E1810;
      cursor: pointer; padding: 0;
      margin-right: 0.8rem;
      line-height: 1;
    }
    .header .title {
      font-size: 1rem; font-weight: 700;
      color: #1E1810; letter-spacing: 0.02em;
    }
    .ai-badge {
      margin-left: auto;
      background: linear-gradient(135deg, #7A2525, #b94040);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.18rem 0.55rem;
      border-radius: 20px;
      letter-spacing: 0.04em;
    }

    .content { padding: 16px 1.1rem 4rem; }

    .date-badge {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .date-badge span {
      background: #7A2525;
      color: #fff;
      font-size: 0.82rem;
      padding: 0.3rem 1rem;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }

    .fortune-card {
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 1rem;
    }

    /* 로딩 */
    .loading-box {
      text-align: center;
      padding: 2.5rem 1rem;
    }
    .loading-spinner {
      width: 48px; height: 48px;
      border: 4px solid #f0e8d8;
      border-top: 4px solid #7A2525;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.2rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      color: #7A2525;
      font-size: 0.9rem;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .loading-steps {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: #aaa;
      line-height: 1.8;
    }

    /* 운세 섹션 */
    .fortune-sections { margin-top: 1rem; }
    .fortune-section {
      padding: 0.9rem 1rem;
      background: #fdf6e3;
      border-radius: 8px;
      margin-bottom: 0.7rem;
      border-left: 3px solid #7A2525;
    }
    .fortune-section-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #7A2525;
      letter-spacing: 0.06em;
      margin-bottom: 0.35rem;
    }
    .fortune-section-text {
      font-size: 0.87rem;
      line-height: 1.8;
      color: #555;
    }

    /* 에러 */
    .error-box {
      text-align: center;
      padding: 2rem 1rem;
      color: #888;
    }
    .error-icon { font-size: 2rem; margin-bottom: 0.8rem; }
    .error-text { font-size: 0.88rem; line-height: 1.7; margin-bottom: 1rem; }
    .retry-small-btn {
      background: #7A2525;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: 'Noto Serif KR', serif;
    }

    /* 운세 내용 */
    .fortune-icon {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 0.8rem;
    }
    .fortune-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1E1810;
      text-align: center;
      margin-bottom: 1rem;
    }
    .fortune-text {
      font-size: 0.9rem;
      line-height: 1.9;
      color: #444;
      white-space: pre-wrap;
    }

    .luck-meter {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #f0e8d8;
    }
    .luck-label {
      font-size: 0.8rem;
      color: #888;
      white-space: nowrap;
    }
    .luck-bar-bg {
      flex: 1;
      height: 8px;
      background: #f0e8d8;
      border-radius: 4px;
      overflow: hidden;
    }
    .luck-bar {
      height: 100%;
      background: #7A2525;
      border-radius: 4px;
      transition: width 1s ease;
    }
    .luck-score {
      font-size: 0.85rem;
      font-weight: 700;
      color: #7A2525;
      white-space: nowrap;
    }

    .retry-btn {
      display: block;
      width: 100%;
      padding: 0.8rem;
      background: #7A2525;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 1rem;
      font-family: 'Noto Serif KR', serif;
    }

    /* 페이드인 */
    .fade-in {
      animation: fadeIn 0.8s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="history.back()">←</button>
  <span class="title">오늘의 운세</span>
  <span class="ai-badge">✨ AI</span>
</div>

<!-- 사용자 정보 배너 -->
<div id="userBanner" style="display:none; background:#fff3f3; border-bottom:1px solid #f0e0e0; padding:0.55rem 1.1rem; margin-top:54px; font-size:0.82rem; color:#7A2525; font-family:'Noto Serif KR',serif;">
  <span id="userBannerText"></span>
</div>

<div class="content">
  <div class="date-badge">
    <span id="todayDate"></span>
  </div>

  <div class="fortune-card" id="fortuneCard">
    <!-- 로딩 -->
    <div class="loading-box" id="loadingBox">
      <div class="loading-spinner"></div>
      <div class="loading-text">AI가 오늘의 운세를 살펴보는 중...</div>
      <div class="loading-steps" id="loadingSteps">사주 정보를 분석하고 있습니다...</div>
    </div>
    <!-- 에러 -->
    <div class="error-box" id="errorBox" style="display:none;">
      <div class="error-icon">🌧️</div>
      <div class="error-text" id="errorText">운세를 불러오는 중 문제가 발생했습니다.</div>
      <button class="retry-small-btn" onclick="loadFortune()">다시 시도</button>
    </div>
    <!-- 운세 내용 -->
    <div id="fortuneContent" style="display:none;">
      <div class="fortune-icon" id="fortuneIcon">🔮</div>
      <div class="fortune-title" id="fortuneTitle"></div>
      <div class="fortune-text" id="fortuneText"></div>
      <div class="fortune-sections" id="fortuneSections"></div>
      <div class="luck-meter">
        <span class="luck-label">오늘의 운</span>
        <div class="luck-bar-bg">
          <div class="luck-bar" id="luckBar" style="width:0%"></div>
        </div>
        <span class="luck-score" id="luckScore"></span>
      </div>
    </div>
  </div>

  <button class="retry-btn" onclick="location.href='index.html'">← 돌아가기</button>
</div>

<script>
  // ── 사용자 정보 ───────────────────────────────
  let userData = null;
  (function() {
    const raw = sessionStorage.getItem('fortuneUser');
    if (!raw) return;
    try {
      userData = JSON.parse(raw);
      const genderLabel = userData.gender === 'male' ? '남성' : '여성';
      const hourLabel = userData.hour ? ` · ${userData.hour}시생` : '';
      const text = `✨ ${userData.name}님 (${userData.year}년 ${userData.month}월 ${userData.day}일 · ${genderLabel}${hourLabel})`;
      document.getElementById('userBannerText').textContent = text;
      document.getElementById('userBanner').style.display = 'block';
    } catch(e) {}
  })();

  // ── 오늘 날짜 ─────────────────────────────────
  const today = new Date();
  const weekdays = ['일','월','화','수','목','금','토'];
  const dateStr = `${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 (${weekdays[today.getDay()]})`;
  document.getElementById('todayDate').textContent = dateStr;

  // ── 로딩 메시지 순환 ──────────────────────────
  const loadingMessages = [
    '사주 정보를 분석하고 있습니다...',
    '오늘의 천간지지를 살펴보는 중...',
    '운세의 흐름을 읽고 있습니다...',
    'AI 역술가가 풀이 중입니다...',
  ];
  let loadingIdx = 0, loadingTimer = null;
  function startLoading() {
    loadingIdx = 0;
    document.getElementById('loadingSteps').textContent = loadingMessages[0];
    loadingTimer = setInterval(() => {
      loadingIdx = (loadingIdx + 1) % loadingMessages.length;
      document.getElementById('loadingSteps').textContent = loadingMessages[loadingIdx];
    }, 1800);
  }
  function stopLoading() { clearInterval(loadingTimer); }

  // ── AI 운세 호출 (/api/fortune → Vercel 함수) ─
  async function loadFortune() {
    document.getElementById('loadingBox').style.display = 'block';
    document.getElementById('errorBox').style.display = 'none';
    document.getElementById('fortuneContent').style.display = 'none';
    startLoading();

    try {
      const res = await fetch('/api/fortune', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userData, dateStr })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `오류 코드: ${res.status}`);
      }

      const data = await res.json();
      stopLoading();
      renderFortune(data);

    } catch(err) {
      stopLoading();
      document.getElementById('loadingBox').style.display = 'none';
      document.getElementById('errorBox').style.display = 'block';
      document.getElementById('errorText').textContent = err.message || '운세를 불러오는 중 문제가 발생했습니다.';
    }
  }

  // ── 렌더링 ────────────────────────────────────
  function renderFortune(data) {
    document.getElementById('loadingBox').style.display = 'none';
    const content = document.getElementById('fortuneContent');
    content.style.display = 'block';
    content.classList.add('fade-in');

    document.getElementById('fortuneIcon').textContent = data.icon || '🔮';
    document.getElementById('fortuneTitle').textContent = data.title || '오늘의 운세';
    document.getElementById('fortuneText').textContent = data.overall || '';

    // 섹션들 (직장/애정/금전/건강 + 행운아이템)
    const sectionsEl = document.getElementById('fortuneSections');
    sectionsEl.innerHTML = '';
    (data.sections || []).forEach(s => {
      const div = document.createElement('div');
      div.className = 'fortune-section';
      div.innerHTML = `<div class="fortune-section-label">${s.label}</div><div class="fortune-section-text">${s.text}</div>`;
      sectionsEl.appendChild(div);
    });
    if (data.luckyItem) {
      const div = document.createElement('div');
      div.className = 'fortune-section';
      div.style.cssText = 'border-left-color:#c0a050; background:#fffbf0;';
      div.innerHTML = `<div class="fortune-section-label" style="color:#8a6a00;">🍀 오늘의 행운</div><div class="fortune-section-text">${data.luckyItem}</div>`;
      sectionsEl.appendChild(div);
    }

    const score = Math.min(95, Math.max(40, parseInt(data.luckScore) || 75));
    document.getElementById('luckScore').textContent = score + '점';
    setTimeout(() => { document.getElementById('luckBar').style.width = score + '%'; }, 200);
  }

  // ── 시작 ──────────────────────────────────────
  loadFortune();
</script>
</body>
</html>
