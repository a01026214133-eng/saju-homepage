<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘의 운세 - 오복신당</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { min-height: 100vh; background: #FDF6E3; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Serif KR', serif;
      background: transparent;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      overflow-x: hidden;
    }

    /* 헤더 */
    .header {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: #fff;
      padding: 0 1.1rem;
      height: 54px;
      display: flex;
      align-items: center;
      z-index: 100;
      box-shadow: 0 1px 0 #e8e2d9;
    }
    .header .back-btn {
      background: none; border: none;
      font-size: 1.3rem; color: #1E1810;
      cursor: pointer; padding: 0;
      margin-right: 0.8rem;
      line-height: 1;
    }
    .header .title {
      font-size: 1rem; font-weight: 700;
      color: #1E1810; letter-spacing: 0.02em;
    }

    /* 본문 */
    .content {
      padding: 74px 1.1rem 4rem;
    }

    /* 안내 배너 */
    .intro-box {
      background: linear-gradient(135deg, #7A2525 0%, #a03333 100%);
      border-radius: 14px;
      padding: 1.4rem 1.2rem;
      margin-bottom: 1.5rem;
      text-align: center;
      color: #fff;
    }
    .intro-box .icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .intro-box .intro-title {
      font-size: 1.05rem; font-weight: 700;
      margin-bottom: 0.3rem;
    }
    .intro-box .intro-sub {
      font-size: 0.82rem; opacity: 0.85; line-height: 1.6;
    }

    /* 폼 카드 */
    .form-card {
      background: #fff;
      border-radius: 14px;
      padding: 1.5rem 1.2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      margin-bottom: 1rem;
    }

    .field {
      margin-bottom: 1.2rem;
    }
    .field:last-child { margin-bottom: 0; }

    .field-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: #7A2525;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .field-label .required {
      color: #c0392b;
      font-size: 0.75rem;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1.5px solid #e0d8cc;
      border-radius: 9px;
      font-size: 0.95rem;
      font-family: 'Noto Serif KR', serif;
      color: #1E1810;
      background: #faf8f4;
      transition: border-color 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }
    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: #7A2525;
      background: #fff;
    }
    .field input::placeholder {
      color: #b0a898;
      font-size: 0.88rem;
    }

    /* 날짜 행 */
    .date-row {
      display: flex;
      gap: 0.5rem;
    }
    .date-row select {
      flex: 1;
    }

    /* 성별 버튼 */
    .gender-row {
      display: flex;
      gap: 0.6rem;
    }
    .gender-btn {
      flex: 1;
      padding: 0.72rem 0;
      border: 1.5px solid #e0d8cc;
      border-radius: 9px;
      background: #faf8f4;
      font-family: 'Noto Serif KR', serif;
      font-size: 0.92rem;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }
    .gender-btn.active {
      border-color: #7A2525;
      background: #7A2525;
      color: #fff;
    }

    /* 태어난 시간 */
    .time-hint {
      font-size: 0.75rem;
      color: #aaa;
      margin-top: 0.35rem;
    }

    /* 제출 버튼 */
    .submit-btn {
      display: block;
      width: 100%;
      padding: 1rem;
      background: #7A2525;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Noto Serif KR', serif;
      letter-spacing: 0.04em;
      box-shadow: 0 3px 10px rgba(122,37,37,0.25);
      transition: opacity 0.2s;
    }
    .submit-btn:active { opacity: 0.85; }

    /* 에러 */
    .error-msg {
      color: #c0392b;
      font-size: 0.8rem;
      margin-top: 0.3rem;
      display: none;
    }
    .error-msg.show { display: block; }

    /* 페이드인 */
    .fade-in {
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="history.back()">←</button>
  <span class="title">오늘의 운세</span>
</div>

<div class="content fade-in">

  <!-- 안내 배너 -->
  <div class="intro-box">
    <div class="icon">🔮</div>
    <div class="intro-title">나만의 오늘의 운세</div>
    <div class="intro-sub">생년월일과 태어난 시간을 알면<br>더욱 정확한 운세를 볼 수 있어요</div>
  </div>

  <!-- 입력 폼 -->
  <div class="form-card">

    <!-- 이름 -->
    <div class="field">
      <div class="field-label">
        👤 이름 <span class="required">*</span>
      </div>
      <input type="text" id="inputName" placeholder="이름을 입력해 주세요" maxlength="10">
      <div class="error-msg" id="errName">이름을 입력해 주세요.</div>
    </div>

    <!-- 생년월일 -->
    <div class="field">
      <div class="field-label">
        🎂 생년월일 <span class="required">*</span>
      </div>
      <div class="date-row">
        <select id="birthYear">
          <option value="">년도</option>
        </select>
        <select id="birthMonth">
          <option value="">월</option>
        </select>
        <select id="birthDay">
          <option value="">일</option>
        </select>
      </div>
      <div class="error-msg" id="errBirth">생년월일을 모두 선택해 주세요.</div>
    </div>

    <!-- 성별 -->
    <div class="field">
      <div class="field-label">
        ☯️ 성별 <span class="required">*</span>
      </div>
      <div class="gender-row">
        <button class="gender-btn" id="genderMale" onclick="selectGender('male')">♂ 남성</button>
        <button class="gender-btn" id="genderFemale" onclick="selectGender('female')">♀ 여성</button>
      </div>
      <div class="error-msg" id="errGender">성별을 선택해 주세요.</div>
    </div>

    <!-- 태어난 시간 -->
    <div class="field">
      <div class="field-label">
        🕐 태어난 시간 <span style="font-weight:400; color:#aaa; font-size:0.78rem;">(선택)</span>
      </div>
      <select id="birthHour">
        <option value="">모름 / 선택 안 함</option>
        <option value="子">子시 (23:00 ~ 01:00)</option>
        <option value="丑">丑시 (01:00 ~ 03:00)</option>
        <option value="寅">寅시 (03:00 ~ 05:00)</option>
        <option value="卯">卯시 (05:00 ~ 07:00)</option>
        <option value="辰">辰시 (07:00 ~ 09:00)</option>
        <option value="巳">巳시 (09:00 ~ 11:00)</option>
        <option value="午">午시 (11:00 ~ 13:00)</option>
        <option value="未">未시 (13:00 ~ 15:00)</option>
        <option value="申">申시 (15:00 ~ 17:00)</option>
        <option value="酉">酉시 (17:00 ~ 19:00)</option>
        <option value="戌">戌시 (19:00 ~ 21:00)</option>
        <option value="亥">亥시 (21:00 ~ 23:00)</option>
      </select>
      <div class="time-hint">모르셔도 운세를 볼 수 있어요 🌙</div>
    </div>

  </div>

  <!-- 제출 버튼 -->
  <button class="submit-btn" onclick="submitForm()">✨ 오늘의 운세 보기</button>

</div>

<script>
  // ── 생년월일 셀렉트 채우기 ──
  const yearSel = document.getElementById('birthYear');
  const monthSel = document.getElementById('birthMonth');
  const daySel = document.getElementById('birthDay');

  const currentYear = new Date().getFullYear();
  for (let y = currentYear; y >= 1930; y--) {
    yearSel.add(new Option(y + '년', y));
  }
  for (let m = 1; m <= 12; m++) {
    monthSel.add(new Option(m + '월', m));
  }
  function fillDays(year, month) {
    const selected = daySel.value;
    daySel.innerHTML = '<option value="">일</option>';
    const days = new Date(year || 2000, month || 1, 0).getDate();
    for (let d = 1; d <= days; d++) {
      daySel.add(new Option(d + '일', d));
    }
    if (selected) daySel.value = selected;
  }
  fillDays();
  yearSel.addEventListener('change', () => fillDays(yearSel.value, monthSel.value));
  monthSel.addEventListener('change', () => fillDays(yearSel.value, monthSel.value));

  // ── 성별 선택 ──
  let selectedGender = '';
  function selectGender(g) {
    selectedGender = g;
    document.getElementById('genderMale').classList.toggle('active', g === 'male');
    document.getElementById('genderFemale').classList.toggle('active', g === 'female');
    document.getElementById('errGender').classList.remove('show');
  }

  // ── 폼 제출 ──
  function submitForm() {
    let valid = true;

    const name = document.getElementById('inputName').value.trim();
    if (!name) {
      document.getElementById('errName').classList.add('show');
      valid = false;
    } else {
      document.getElementById('errName').classList.remove('show');
    }

    const year = yearSel.value;
    const month = monthSel.value;
    const day = daySel.value;
    if (!year || !month || !day) {
      document.getElementById('errBirth').classList.add('show');
      valid = false;
    } else {
      document.getElementById('errBirth').classList.remove('show');
    }

    if (!selectedGender) {
      document.getElementById('errGender').classList.add('show');
      valid = false;
    }

    if (!valid) return;

    // 세션 스토리지에 저장 후 운세 페이지로 이동
    const hour = document.getElementById('birthHour').value;
    const info = { name, year, month, day, gender: selectedGender, hour };
    sessionStorage.setItem('fortuneUser', JSON.stringify(info));
    location.href = 'fortune_today.html';
  }

  // ── 입력 시 에러 숨김 ──
  document.getElementById('inputName').addEventListener('input', () => {
    document.getElementById('errName').classList.remove('show');
  });
</script>
</body>
</html>
