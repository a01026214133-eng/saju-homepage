<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘의 운세 - 오복신당</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html { min-height: 100vh; background: #FDF6E3; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Serif KR', serif;
      background: transparent;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      overflow-x: hidden;
    }

    .content, .header { position: relative; z-index: 1; }

    .header {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: #fff;
      padding: 0 1.1rem;
      height: 54px;
      display: flex;
      align-items: center;
      z-index: 100;
      box-shadow: 0 1px 0 #e8e2d9;
    }
    .header .back-btn {
      background: none; border: none;
      font-size: 1.3rem; color: #1E1810;
      cursor: pointer; padding: 0;
      margin-right: 0.8rem;
      line-height: 1;
    }
    .header .title {
      font-size: 1rem; font-weight: 700;
      color: #1E1810; letter-spacing: 0.02em;
    }

    .content { padding: 16px 1.1rem 4rem; }

    .date-badge {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .date-badge span {
      background: #7A2525;
      color: #fff;
      font-size: 0.82rem;
      padding: 0.3rem 1rem;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }

    .fortune-card {
      background: #fff;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 1rem;
    }

    /* 로딩 */
    .loading-box {
      text-align: center;
      padding: 2.5rem 1rem;
    }
    .loading-spinner {
      width: 48px; height: 48px;
      border: 4px solid #f0e8d8;
      border-top: 4px solid #7A2525;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.2rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      color: #7A2525;
      font-size: 0.9rem;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* 운세 내용 */
    .fortune-icon {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 0.8rem;
    }
    .fortune-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1E1810;
      text-align: center;
      margin-bottom: 1rem;
    }
    .fortune-text {
      font-size: 0.9rem;
      line-height: 1.9;
      color: #444;
      white-space: pre-wrap;
    }

    .luck-meter {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #f0e8d8;
    }
    .luck-label {
      font-size: 0.8rem;
      color: #888;
      white-space: nowrap;
    }
    .luck-bar-bg {
      flex: 1;
      height: 8px;
      background: #f0e8d8;
      border-radius: 4px;
      overflow: hidden;
    }
    .luck-bar {
      height: 100%;
      background: #7A2525;
      border-radius: 4px;
      transition: width 1s ease;
    }
    .luck-score {
      font-size: 0.85rem;
      font-weight: 700;
      color: #7A2525;
      white-space: nowrap;
    }

    .retry-btn {
      display: block;
      width: 100%;
      padding: 0.8rem;
      background: #7A2525;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 1rem;
      font-family: 'Noto Serif KR', serif;
    }

    /* 페이드인 */
    .fade-in {
      animation: fadeIn 0.8s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="history.back()">←</button>
  <span class="title">오늘의 운세</span>
</div>

<!-- 사용자 정보 배너 -->
<div id="userBanner" style="display:none; background:#fff3f3; border-bottom:1px solid #f0e0e0; padding:0.55rem 1.1rem; margin-top:54px; font-size:0.82rem; color:#7A2525; font-family:'Noto Serif KR',serif;">
  <span id="userBannerText"></span>
</div>

<div class="content">
  <div class="date-badge">
    <span id="todayDate"></span>
  </div>

  <div class="fortune-card" id="fortuneCard">
    <!-- 로딩 -->
    <div class="loading-box" id="loadingBox">
      <div class="loading-spinner"></div>
      <div class="loading-text">오늘의 운세를 살펴보는 중...</div>
    </div>
    <!-- 운세 내용 -->
    <div id="fortuneContent" style="display:none;">
      <div class="fortune-icon" id="fortuneIcon">🔮</div>
      <div class="fortune-title" id="fortuneTitle"></div>
      <div class="fortune-text" id="fortuneText"></div>
      <div class="luck-meter">
        <span class="luck-label">오늘의 운</span>
        <div class="luck-bar-bg">
          <div class="luck-bar" id="luckBar" style="width:0%"></div>
        </div>
        <span class="luck-score" id="luckScore"></span>
      </div>
    </div>
  </div>

  <button class="retry-btn" onclick="location.href='index.html'">← 돌아가기</button>
</div>

<script>
  // 사용자 정보 불러오기
  (function() {
    const raw = sessionStorage.getItem('fortuneUser');
    if (!raw) return;
    try {
      const u = JSON.parse(raw);
      const genderLabel = u.gender === 'male' ? '남성' : '여성';
      const hourLabel = u.hour ? ` · ${u.hour}시생` : '';
      const text = `✨ ${u.name}님 (${u.year}년 ${u.month}월 ${u.day}일 · ${genderLabel}${hourLabel})`;
      document.getElementById('userBannerText').textContent = text;
      document.getElementById('userBanner').style.display = 'block';
    } catch(e) {}
  })();

  // 오늘 날짜
  const today = new Date();
  const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
  const dateStr = `${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 (${weekdays[today.getDay()]})`;
  document.getElementById('todayDate').textContent = dateStr;

  // 날짜 기반 시드 난수
  const seed = today.getFullYear() * 10000 + (today.getMonth()+1) * 100 + today.getDate();
  function seededRandom(s) {
    let x = Math.sin(s) * 10000;
    return x - Math.floor(x);
  }

  // 운세 목록
  const fortunes = [
    {
      icon: "🌟",
      title: "빛나는 하루",
      fortune: "오늘은 기대하지 않은 곳에서 좋은 소식이 찾아올 것입니다. 주변 사람들과의 대화에서 새로운 기회를 발견할 수 있으니 마음을 열어두세요. 오전보다 오후에 더 좋은 흐름이 이어질 것입니다. 작은 친절이 큰 복으로 돌아오는 날입니다.",
      luckScore: 88
    },
    {
      icon: "🌸",
      title: "봄바람 같은 날",
      fortune: "오늘은 마음이 한결 가볍고 여유로운 하루가 될 것입니다. 오랫동안 망설이던 일을 시작하기에 좋은 시기입니다. 가까운 사람에게 진심을 전하면 관계가 더욱 돈독해질 것입니다. 저녁 무렵 뜻밖의 즐거운 일이 생길 수 있습니다.",
      luckScore: 82
    },
    {
      icon: "🍀",
      title: "행운이 가득",
      fortune: "오늘은 작은 노력이 큰 결실을 맺는 날입니다. 오전 중 중요한 결정을 내려야 한다면 직감을 믿으세요. 금전적으로 좋은 흐름이 이어지며, 예상치 못한 이익이 생길 수도 있습니다. 건강에도 활력이 넘쳐 무엇이든 척척 해낼 수 있는 날입니다.",
      luckScore: 91
    },
    {
      icon: "🌙",
      title: "차분한 성찰",
      fortune: "오늘은 서두르기보다 차분하게 생각을 정리하는 날입니다. 평소 미뤄두었던 일들을 하나씩 처리하면 마음이 한결 편안해질 것입니다. 새로운 도전보다는 기존의 것을 다듬고 발전시키는 데 집중하세요. 저녁에는 혼자만의 시간을 갖는 것이 좋습니다.",
      luckScore: 65
    },
    {
      icon: "☀️",
      title: "따뜻한 인연",
      fortune: "오늘은 사람 복이 넘치는 날입니다. 오래된 인연이 다시 이어지거나, 새로운 소중한 만남이 생길 수 있습니다. 주변의 도움을 기꺼이 받아들이세요. 혼자 해결하려 하기보다 함께할 때 더 큰 성과를 낼 수 있는 날입니다.",
      luckScore: 85
    },
    {
      icon: "💫",
      title: "변화의 바람",
      fortune: "오늘은 새로운 변화를 받아들이기 좋은 날입니다. 익숙한 것에서 벗어나 새로운 시도를 해보세요. 처음엔 낯설 수 있지만 곧 자연스럽게 적응하게 될 것입니다. 용기 있는 선택이 앞날에 큰 도움이 될 것입니다.",
      luckScore: 78
    },
    {
      icon: "🌈",
      title: "희망찬 시작",
      fortune: "오늘은 막혔던 일이 풀리기 시작하는 날입니다. 그동안의 노력이 서서히 빛을 발하게 될 것입니다. 긍정적인 마음가짐이 오늘 하루의 운을 크게 좌우합니다. 작은 성취에도 스스로를 칭찬하고 격려하는 하루가 되세요.",
      luckScore: 80
    },
    {
      icon: "🎯",
      title: "집중의 날",
      fortune: "오늘은 한 가지 목표에 집중할수록 좋은 결과를 얻을 수 있는 날입니다. 여러 일을 동시에 하기보다 우선순위를 정해 차근차근 진행하세요. 오후 시간대에 집중력이 최고조에 달하니 중요한 일은 오후에 처리하는 것이 좋습니다.",
      luckScore: 75
    },
    {
      icon: "🦋",
      title: "새로운 도약",
      fortune: "오늘은 자신감을 갖고 앞으로 나아가기 좋은 날입니다. 두려움을 내려놓고 한 걸음만 내디디면 생각보다 훨씬 수월하게 나아갈 수 있습니다. 주변의 응원과 지지가 큰 힘이 되어줄 것입니다. 작은 용기가 인생을 바꾸는 날입니다.",
      luckScore: 83
    },
    {
      icon: "🌺",
      title: "풍요로운 하루",
      fortune: "오늘은 감사한 마음으로 하루를 시작하면 더욱 좋은 일들이 찾아올 것입니다. 물질적으로나 정신적으로나 풍요로움을 느낄 수 있는 날입니다. 나눔을 실천하면 더 큰 복이 돌아옵니다. 건강하고 활기찬 하루가 될 것입니다.",
      luckScore: 87
    }
  ];

  // 날짜 기반으로 운세 선택
  const idx = Math.floor(seededRandom(seed) * fortunes.length);
  const fortune = fortunes[idx];
  const luckScore = Math.min(95, Math.max(40, fortune.luckScore + Math.floor(seededRandom(seed + 1) * 10) - 5));

  // 로딩 1.5초 후 운세 표시
  setTimeout(() => {
    document.getElementById('loadingBox').style.display = 'none';
    const content = document.getElementById('fortuneContent');
    content.style.display = 'block';
    content.classList.add('fade-in');

    document.getElementById('fortuneIcon').textContent = fortune.icon;
    document.getElementById('fortuneTitle').textContent = fortune.title;
    document.getElementById('fortuneText').textContent = fortune.fortune;
    document.getElementById('luckScore').textContent = luckScore + '점';

    setTimeout(() => {
      document.getElementById('luckBar').style.width = luckScore + '%';
    }, 200);
  }, 1500);
</script>
</body>
</html>
