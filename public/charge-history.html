<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 충전 내역 — 오복신당</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background-color: #EDE9DF;
      background-image:
        repeating-linear-gradient(45deg, rgba(180,160,130,0.07) 0px, rgba(180,160,130,0.07) 1px, transparent 1px, transparent 20px),
        repeating-linear-gradient(-45deg, rgba(180,160,130,0.07) 0px, rgba(180,160,130,0.07) 1px, transparent 1px, transparent 20px);
      font-family: 'Noto Serif KR', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 헤더 */
    .header {
      width: 100%; max-width: 430px;
      background: #fff;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      padding: 0 16px;
      height: 56px;
      position: sticky; top: 0; z-index: 10;
    }
    .header-back {
      background: none; border: none;
      font-size: 20px; color: #3a2e22;
      cursor: pointer; padding: 8px 12px 8px 0; line-height: 1;
    }
    .header-title { font-size: 15px; color: #2a1f14; letter-spacing: 0.06em; }

    /* 잔액 카드 */
    .balance-card {
      width: 100%; max-width: 430px;
      background: #1a1209;
      padding: 28px 24px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      position: relative; overflow: hidden;
    }
    .balance-card::before {
      content: '🐱';
      position: absolute; right: 20px; bottom: -8px;
      font-size: 72px; opacity: 0.08; line-height: 1;
    }
    .balance-label { font-size: 11px; color: #a09070; letter-spacing: 0.12em; }
    .balance-amount { font-size: 38px; font-weight: 600; color: #c8b89a; letter-spacing: -0.5px; line-height: 1.15; }
    .balance-unit { font-size: 15px; color: #c8b89a; letter-spacing: 0.08em; margin-left: 4px; }
    .balance-charge-btn {
      margin-top: 14px; padding: 9px 28px;
      background: #8B1520; color: #fff;
      border: none; border-radius: 22px;
      font-family: 'Noto Serif KR', serif;
      font-size: 13px; letter-spacing: 0.08em;
      cursor: pointer; transition: background 0.18s;
    }
    .balance-charge-btn:hover { background: #a01a28; }

    /* 탭 */
    .tab-bar {
      width: 100%; max-width: 430px;
      background: #fff;
      display: flex;
      border-bottom: 1px solid #ede7dd;
      position: sticky; top: 56px; z-index: 9;
    }
    .tab {
      flex: 1; padding: 13px 0;
      background: none; border: none;
      font-family: 'Noto Serif KR', serif;
      font-size: 13px; color: #b0a090; letter-spacing: 0.04em;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.18s, border-color 0.18s;
    }
    .tab.active { color: #1a1209; border-bottom-color: #8B1520; }

    /* 목록 */
    .list-wrap { width: 100%; max-width: 430px; padding: 0 0 60px; }

    .date-group-label { padding: 18px 20px 8px; font-size: 11px; color: #a09070; letter-spacing: 0.06em; }

    .history-item {
      background: #fff;
      display: flex; align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #f0ebe3;
      gap: 14px;
    }
    .item-icon {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .item-icon.charge { background: #fdf3ef; }
    .item-icon.use    { background: #f0f5ff; }
    .item-icon.expire { background: #f5f5f5; }
    .item-icon.refund { background: #f0faf4; }

    .item-body { flex: 1; min-width: 0; }
    .item-title { font-size: 14px; color: #2a1f14; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub { font-size: 11px; color: #b0a090; }

    .item-right { flex-shrink: 0; text-align: right; }
    .item-amount { font-size: 15px; font-weight: 600; }
    .item-amount.plus  { color: #c8b89a; }
    .item-amount.minus { color: #3a3a3a; }
    .item-amount .unit { font-size: 11px; font-weight: 400; margin-left: 1px; }
    .item-after { font-size: 10px; color: #c0b4a4; margin-top: 2px; }

    /* 빈 상태 */
    .empty-state {
      display: none; flex-direction: column; align-items: center;
      padding: 64px 24px; gap: 12px;
    }
    .empty-state.visible { display: flex; }
    .empty-icon { font-size: 48px; opacity: 0.3; }
    .empty-text { font-size: 14px; color: #b0a090; text-align: center; line-height: 2; }

    /* 로딩 */
    .loading-wrap { display: flex; justify-content: center; padding: 48px 0; }
    .spinner { width: 28px; height: 28px; border: 2.5px solid #e0d8cc; border-top-color: #c8b89a; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 로그인 필요 */
    .login-notice { width: 100%; max-width: 430px; display: none; flex-direction: column; align-items: center; padding: 64px 32px; gap: 14px; }
    .login-notice.visible { display: flex; }
    .login-notice-icon { font-size: 52px; opacity: 0.4; }
    .login-notice-text { font-size: 14px; color: #b0a090; text-align: center; line-height: 2; }
    .login-notice-btn {
      margin-top: 4px; padding: 11px 32px;
      background: #1a1209; color: #c8b89a;
      border: none; border-radius: 7px;
      font-family: 'Noto Serif KR', serif;
      font-size: 14px; letter-spacing: 0.08em;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header class="header">
  <button class="header-back" onclick="history.back()">&#8592;</button>
  <span class="header-title">내 충전 내역</span>
</header>

<div class="balance-card" id="balanceCard" style="display:none;">
  <span class="balance-label">보유 냥이</span>
  <div>
    <span class="balance-amount" id="balanceAmount">0</span>
    <span class="balance-unit">냥</span>
  </div>
  <button class="balance-charge-btn" onclick="location.href='payment.html'">충전하기</button>
</div>

<div class="tab-bar" id="tabBar" style="display:none;">
  <button class="tab active" data-tab="all"    onclick="switchTab(this)">전체</button>
  <button class="tab"        data-tab="charge" onclick="switchTab(this)">충전</button>
  <button class="tab"        data-tab="use"    onclick="switchTab(this)">사용</button>
</div>

<div class="list-wrap" id="listWrap" style="display:none;">
  <div class="loading-wrap" id="loadingWrap"><div class="spinner"></div></div>
  <div id="historyList"></div>
  <div class="empty-state" id="emptyState">
    <span class="empty-icon">🐱</span>
    <p class="empty-text">아직 내역이 없어요.<br>냥이를 충전하고 사주를 확인해보세요!</p>
  </div>
</div>

<div class="login-notice" id="loginNotice">
  <span class="login-notice-icon">🔐</span>
  <p class="login-notice-text">로그인 후 냥이 충전 내역을<br>확인할 수 있어요.</p>
  <button class="login-notice-btn" onclick="location.href='index.html'">로그인하러 가기</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://ucdnplzmfnnnkgqistbs.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_OQ9jEJd3gFievOWIJSU6YA_Gn2i2qee';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let _currentTab = 'all';
  let _allHistory = [];

  function switchTab(el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    _currentTab = el.dataset.tab;
    renderList(_allHistory);
  }

  function fmt(n) { return Number(n).toLocaleString('ko-KR'); }

  function fmtDate(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
  }
  function fmtDateTime(iso) {
    const d = new Date(iso);
    return `${fmtDate(iso)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  function renderList(data) {
    const filtered = _currentTab === 'all' ? data : data.filter(r => r.type === _currentTab);
    const list  = document.getElementById('historyList');
    const empty = document.getElementById('emptyState');

    if (!filtered.length) {
      list.innerHTML = '';
      empty.classList.add('visible');
      return;
    }
    empty.classList.remove('visible');

    const groups = {};
    filtered.forEach(r => {
      const d = fmtDate(r.created_at);
      if (!groups[d]) groups[d] = [];
      groups[d].push(r);
    });

    const icons   = { charge:'💰', use:'⭐', expire:'⏳', refund:'↩️' };
    const classes = { charge:'charge', use:'use', expire:'expire', refund:'refund' };

    let html = '';
    Object.keys(groups).sort((a,b) => b.localeCompare(a)).forEach(date => {
      html += `<div class="date-group-label">${date}</div>`;
      groups[date].forEach(r => {
        const isPlus  = r.type === 'charge' || r.type === 'refund';
        const sign    = isPlus ? '+' : '-';
        const amtCls  = isPlus ? 'plus' : 'minus';
        const label   = r.label || (r.type === 'charge' ? '냥이 충전' : r.type === 'use' ? '냥이 사용' : r.type === 'refund' ? '환불' : '소멸');
        html += `
        <div class="history-item">
          <div class="item-icon ${classes[r.type] || 'charge'}">${icons[r.type] || '💰'}</div>
          <div class="item-body">
            <div class="item-title">${label}</div>
            <div class="item-sub">${fmtDateTime(r.created_at)}</div>
          </div>
          <div class="item-right">
            <div class="item-amount ${amtCls}">${sign}${fmt(r.amount)}<span class="unit">냥</span></div>
            <div class="item-after">잔액 ${fmt(r.balance_after)}냥</div>
          </div>
        </div>`;
      });
    });
    list.innerHTML = html;
  }

  async function loadHistory(user) {
    const { data: wallet } = await _supabase
      .from('wallets')
      .select('balance')
      .eq('user_id', user.id)
      .single();

    const balance = wallet?.balance ?? 0;
    document.getElementById('balanceAmount').textContent = fmt(balance);
    document.getElementById('balanceCard').style.display = '';
    document.getElementById('tabBar').style.display = '';
    document.getElementById('listWrap').style.display = '';

    const { data: history } = await _supabase
      .from('charge_history')
      .select('*')
      .eq('user_id', user.id)
      .order('created_at', { ascending: false });

    document.getElementById('loadingWrap').style.display = 'none';
    _allHistory = history || [];
    renderList(_allHistory);
  }

  _supabase.auth.getSession().then(({ data: { session } }) => {
    if (session?.user) {
      loadHistory(session.user);
    } else {
      document.getElementById('loginNotice').classList.add('visible');
    }
  });
</script>
</body>
</html>
